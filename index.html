<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Digital Art Gallery</title>
        <link rel="stylesheet" href="css/indexStyle.css" />
    </head>

    <body>
        <section class="content">
            <h1 class="title">
                Digital<br />
                Art Gallery
            </h1>
            <p class="lang-prompt">언어를 선택해주세요 / 言語を選んでください</p>
            <div class="lang-btns">
                <button class="btn lang-btn" onclick="selectLang('ko')">한국어</button>
                <button class="btn lang-btn" onclick="selectLang('ja')">日本語</button>
            </div>
        </section>

        <script>
            function selectLang(lang) {
                localStorage.setItem('gallery_lang', lang);
                location.href = './pages/how_to_view.html';
            }
        </script>
    </body>
</html>
