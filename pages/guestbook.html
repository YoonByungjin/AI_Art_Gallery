<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>방명록</title>
    <script src="../js/i18n.js"></script>
    <style>
        body {
            background: #0d1117;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            width: 70%;
            margin: 0 auto;
            margin-top: 80px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            color: white;
            font-family: inherit;
        }

        textarea {
            height: 120px;
            resize: none;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: white;
            color: black;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
        }

        .btn:hover {
            background: #e5e5e5;
        }

        .guest-item {
            text-align: left;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .guest-name {
            font-weight: bold;
            font-size: 18px;
        }

        .guest-message {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 4px;
        }

        .arrow-btn {
            width: 60px;
            cursor: pointer;
            margin-top: 40px;
            transition: 0.2s;
            filter: brightness(0.9);
        }

        .arrow-btn:hover {
            filter: brightness(1.2);
        }
    </style>
</head>

<body>

    <h1 data-i18n="gb.title">방명록</h1>
    <p data-i18n="gb.subtitle">전시를 관람하신 소감을 남겨주세요. 여러분의 생각이 궁금합니다.</p>

    <div class="container">
        <h3 data-i18n="gb.label.name">이름</h3>
        <input type="text" id="name1"
            data-i18n-placeholder="gb.placeholder.name"
            placeholder="이름을 입력하세요">

        <h3 data-i18n="gb.label.msg">메시지</h3>
        <textarea id="comment1"
            data-i18n-placeholder="gb.placeholder.msg"
            placeholder="전시에 대한 소감을 남겨주세요"></textarea>

        <button class="btn" data-i18n="gb.btn">방명록 작성</button>
    </div>

    <div class="container" style="margin-top:40px;">
        <h2 data-i18n="gb.list.title">이전에 남겨진 방명록</h2>
    </div>

    <!-- ▼ 다음 페이지로 이동하는 화살표 버튼 -->
    <div style="text-align:center;">
        <a href="../pages/events.html">
            <img src="../image/arrow.png" class="arrow-btn" alt="다음 페이지로 이동">
        </a>
    </div>

    <script>
        const DEFAULT_ENTRIES = {
            ko: [
                { name: "홍길동", message: "전시가 너무 인상 깊었습니다." },
                { name: "김영희", message: "작품들의 분위기가 너무 좋았어요." },
                { name: "Yuki", message: "静かで美しい展示でした。特に最後の作品が印象的でした。" }
            ],
            ja: [
                { name: "田中 さくら", message: "静かで美しい展示でした。特に最後の作品が印象的でした。" },
                { name: "鈴木 一郎", message: "AIと人間の関係を芸術で表現するという発想が素晴らしかったです。" },
                { name: "홍길동", message: "전시가 너무 인상 깊었습니다." }
            ]
        };

        window.onload = function () {
            const lang = localStorage.getItem(LANG_KEY) || 'ko';
            const STORAGE_KEY = 'guestbook_entries_' + lang;
            const container = document.querySelector(".container:nth-of-type(2)");

            function loadEntries() {
                const saved = localStorage.getItem(STORAGE_KEY);
                return saved ? JSON.parse(saved) : DEFAULT_ENTRIES[lang];
            }

            function saveEntries(entries) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
            }

            function renderEntry(entry) {
                const div = document.createElement("div");
                div.classList.add("guest-item");
                div.innerHTML = `
                    <div class="guest-name">${entry.name}</div>
                    <div class="guest-message">${entry.message}</div>
                `;
                container.appendChild(div);
            }

            loadEntries().forEach(renderEntry);

            document.querySelector(".btn").addEventListener("click", () => {
                const name1 = document.getElementById("name1").value.trim();
                const comment1 = document.getElementById("comment1").value.trim();

                if (!name1 || !comment1) {
                    alert(translations[lang]['gb.alert']);
                    return;
                }

                const newEntry = { name: name1, message: comment1 };
                renderEntry(newEntry);

                const entries = loadEntries();
                entries.push(newEntry);
                saveEntries(entries);

                document.getElementById("name1").value = "";
                document.getElementById("comment1").value = "";
            });
        };
    </script>

</body>

</html>
