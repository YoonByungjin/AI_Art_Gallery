<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>방명록</title>
    <style>
        @font-face {
            font-family: 'BookkMyungjo';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/BookkMyungjo-Lt.woff2') format('woff2');
            font-weight: 400;
            font-display: swap;
        }

        @font-face {
            font-family: 'BookkMyungjo';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/BookkMyungjo-Bd.woff2') format('woff2');
            font-weight: 700;
            font-display: swap;
        }

        body {
            background: #0d1117;
            color: white;
            font-family: 'BookkMyungjo', Arial, sans-serif;
            text-align: center;
        }

        .container {
            width: 70%;
            margin: 0 auto;
            margin-top: 80px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            font-family: 'BookkMyungjo', Arial, sans-serif;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            color: white;
            font-family: 'BookkMyungjo', Arial, sans-serif;
        }

        textarea {
            height: 120px;
            resize: none;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: white;
            color: black;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'BookkMyungjo', Arial, sans-serif;
        }

        .btn:hover {
            background: #e5e5e5;
        }

        .guest-item {
            text-align: left;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-family: 'BookkMyungjo', Arial, sans-serif;
        }

        .guest-name {
            font-weight: bold;
            font-size: 18px;
        }

        .guest-message {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 4px;
        }

        .arrow-btn {
            width: 60px;
            cursor: pointer;
            margin-top: 40px;
            transition: 0.2s;
            filter: brightness(0.9);
        }

        .arrow-btn:hover {
            filter: brightness(1.2);
        }
    </style>
</head>

<body>

    <h1>방명록</h1>
    <p>전시를 관람하신 소감을 남겨주세요. 여러분의 생각이 궁금합니다.</p>

    <div class="container">
        <h3>이름</h3>
        <input type="text" placeholder="이름을 입력하세요">

        <h3>메시지</h3>
        <textarea placeholder="전시에 대한 소감을 남겨주세요"></textarea>

        <button class="btn">방명록 작성</button>
    </div>

    <!--  기존 작성자 목록 -->
    <div class="container" style="margin-top:40px;">
        <h2>이전에 남겨진 방명록</h2>

        <div class="guest-item">
            <div class="guest-name">홍길동</div>
            <div class="guest-message">전시가 너무 인상 깊었습니다.</div>
        </div>

        <div class="guest-item">
            <div class="guest-name">김영희</div>
            <div class="guest-message">작품들의 분위기가 너무 좋았어요.</div>
        </div>

        <div class="guest-item">
            <div class="guest-name">Yuki</div>
            <div class="guest-message">静かで美しい展示でした。特に最後の作品が印象的でした。</div>
        </div>
    </div>

    <!-- ▼ 다음 페이지로 이동하는 화살표 버튼 -->
    <div style="text-align:center;">
        <a href="next.html">
            <img src="arrow.png" class="arrow-btn" alt="다음 페이지로 이동">
        </a>
    </div>

</body>

</html>
