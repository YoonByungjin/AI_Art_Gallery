<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>how_to_view5</title>
    <link rel="stylesheet" href="../css/how_to_view.css">
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const button = document.getElementById('nextPageButton');
            button.addEventListener('click', function (event) {
                // 페이지 이동 로직
                window.location.href = 'gallery1.html';
            });
        });
    </script>
</head>

<body>

    <body>
        <div class="container">

            <a href="#" class="next-btn" id="nextPageButton">
                <img src="../image/arrow.png" alt="다음 페이지" class="arrow-icon">
            </a>

            <div class="content-wrapper">

                <h1 class="title">전시 관람 방법</h1>

                <div class="rule">
                    당신의 감상을 남기고,<br>
                    다른 관람자들과 공유해보세요.
                </div>

                <div class="description">
                    <p>작품을 모두 감상한 뒤 떠오른 생각이나 느낌을 방명록에 자유롭게 적어주세요.</p>
                    <p>당신의 한 줄이 또 다른 누군가의 해석이 되고,</p>
                    <p>또 하나의 이야기가 되어 전시의 즐거움을 더해줍니다.</p>
                </div>

            </div>
        </div>
    </body>
</body>

</html>
